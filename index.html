<!DOCTYPE html>
<html>
<head>
    <title>LADDERS | Daily Ranking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style id="theme-style">
        /* Base Engine Styles */
        :root { --bg: #121212; --item: #1e1e1e; --text: #ffffff; --accent: #ff4d4d; --font: 'Helvetica Neue', Arial; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; transition: background 0.5s; }
        
        header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .logo { font-weight: 900; font-size: 22px; letter-spacing: -1px; }
        .stats-box { text-align: right; font-size: 10px; font-weight: bold; line-height: 1.2; }
        .streak-val { font-size: 16px; color: var(--accent); }

        .theme-tag { border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
        
        #sortable-list { list-style: none; padding: 0; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 8px; }
        .item { 
            display: flex; align-items: center; padding: 15px; background: var(--item); 
            border-radius: 6px; cursor: grab; border: 1px solid #333; position: relative; overflow: hidden;
        }
        .item.dragging { opacity: 0.5; transform: scale(0.98); }

        .swatch-reveal { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; transition: width 0.4s; opacity: 0.8; z-index: 1; }
        .item.peeked .swatch-reveal { width: 100%; }
        .item.solved .swatch-reveal { width: 100%; }

        .name { position: relative; z-index: 2; font-weight: bold; font-size: 14px; }
        .peek-btn { margin-left: auto; font-size: 10px; color: var(--text); border: 1px solid #444; padding: 2px 6px; border-radius: 4px; cursor: pointer; z-index: 3; opacity: 0.6; }
        
        .controls { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 350px; }
        button { padding: 16px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        #submitBtn { background: var(--accent); color: white; }
        #masterBtn { background: transparent; border: 2px solid var(--accent); color: var(--accent); display: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo">LADDERS</div>
        <div class="stats-box">STREAK<br><span id="streak-count" class="streak-val">0</span></div>
    </header>

    <div id="active-tag" class="theme-tag">LOADING...</div>
    <div id="peek-display" style="font-size: 12px; margin-bottom: 20px; opacity: 0.8;">Peeks remaining: 3</div>

    <ul id="sortable-list"></ul>

    <div class="controls">
        <button id="submitBtn" onclick="submit()">SUBMIT SEQUENCE</button>
        <button id="masterBtn" onclick="showMaster()">VIEW CORRECT LADDER</button>
    </div>

    <script>
        const vault = [
            { 
                title: "RED: LIGHT ➔ DARK", 
                skin: { bg: "#121212", item: "#1e1e1e", text: "#fff", accent: "#ff4d4d", font: "Arial" },
                items: [
                    {n: "Misty Rose", r: 1, c: "#FFE4E1"}, {n: "Salmon", r: 2, c: "#FA8072"}, {n: "Coral", r: 3, c: "#FF7F50"},
                    {n: "Orange-Red", r: 4, c: "#FF4500"}, {n: "Candy Apple", r: 5, c: "#FF0000"}, {n: "Ruby", r: 6, c: "#E0115F"},
                    {n: "Firebrick", r: 7, c: "#B22222"}, {n: "Dark Red", r: 8, c: "#8B0000"}, {n: "Maroon", r: 9, c: "#800000"}, {n: "Black Cherry", r: 10, c: "#3D0B0B"}
                ]
            },
            { 
                title: "MILITARY: LEAST ➔ MOST LIVES LOST", 
                skin: { bg: "#2b2d2f", item: "#3f4143", text: "#d1d1d1", accent: "#78866b", font: "Courier New" },
                items: [
                    {n: "War of 1812", r: 1, c: "#4a5043"}, {n: "Spanish-American War", r: 2, c: "#5a6152"}, {n: "Revolutionary War", r: 3, c: "#6a7261"},
                    {n: "Vietnam War", r: 4, c: "#7b8371"}, {n: "Korean War", r: 5, c: "#8b9480"}, {n: "WWI", r: 6, c: "#9ba590"},
                    {n: "Civil War", r: 7, c: "#acb69f"}, {n: "WWII", r: 8, c: "#bcd7af"}, {n: "Mongol Invasions", r: 9, c: "#cde8bf"}
                ]
            },
            { 
                title: "BLUE: LIGHT ➔ DARK", 
                skin: { bg: "#0a1128", item: "#001f54", text: "#fff", accent: "#007ea7", font: "Verdana" },
                items: [
                    {n: "Alice Blue", r: 1, c: "#F0F8FF"}, {n: "Sky Blue", r: 2, c: "#87CEEB"}, {n: "Baby Blue", r: 3, c: "#89CFF0"},
                    {n: "Cornflower", r: 4, c: "#6495ED"}, {n: "Steel Blue", r: 5, c: "#4682B4"}, {n: "Cobalt", r: 6, c: "#0047AB"},
                    {n: "Royal Blue", r: 7, c: "#4169E1"}, {n: "Sapphire", r: 8, c: "#0F52BA"}, {n: "Navy Blue", r: 9, c: "#000080"}, {n: "Midnight Blue", r: 10, c: "#191970"}
                ]
            },
            { 
                title: "CLASSIC LIBRARY: LOW ➔ HIGH SALES", 
                skin: { bg: "#f4ece1", item: "#fffdfa", text: "#2c241e", accent: "#5d544b", font: "Georgia" },
                items: [
                    {n: "Elizabeth Gaskell", r: 1, c: "#dcd3c1"}, {n: "George Eliot", r: 2, c: "#cfc4b0"}, {n: "Anthony Trollope", r: 3, c: "#c2b59f"},
                    {n: "The Brontës", r: 4, c: "#b5a68e"}, {n: "Thomas Hardy", r: 5, v: 50, c: "#a8977d"}, {n: "Charles Dickens", r: 6, c: "#9b886c"}
                ]
            }
        ];

        let peeksLeft = 3;
        const launchDate = new Date("2026-01-18");
        const diffDays = Math.floor((new Date() - launchDate) / 86400000);
        const active = vault[diffDays % vault.length];

        function init() {
            // Apply Skin
            const r = document.documentElement.style;
            r.setProperty('--bg', active.skin.bg);
            r.setProperty('--item', active.skin.item);
            r.setProperty('--text', active.skin.text);
            r.setProperty('--accent', active.skin.accent);
            r.setProperty('--font', active.skin.font);

            document.getElementById('active-tag').innerText = active.title;
            document.getElementById('streak-count').innerText = localStorage.getItem('ladders_streak') || 0;
            
            const list = document.getElementById('sortable-list');
            [...active.items].sort(() => Math.random() - 0.5).forEach(item => {
                list.innerHTML += `
                    <li class="item" draggable="true" data-rank="${item.r}">
                        <div class="swatch-reveal" style="background:${item.c}"></div>
                        <span class="name">${item.n}</span>
                        <div class="peek-btn" onclick="peek(this)">PEEK</div>
                    </li>`;
            });
            setupDraggables();
        }

        function peek(btn) {
            if (peeksLeft > 0) {
                const parent = btn.parentElement;
                parent.classList.add('peeked');
                peeksLeft--;
                document.getElementById('peek-display').innerText = `Peeks remaining: ${peeksLeft}`;
                btn.style.display = 'none';
                setTimeout(() => { if(!document.getElementById('submitBtn').disabled) parent.classList.remove('peeked'); }, 1000);
            }
        }

        function submit() {
            const items = [...document.querySelectorAll('.item')];
            let correct = 0;
            items.forEach((item, idx) => {
                item.classList.add('solved');
                const isCorrect = item.dataset.rank == (idx + 1);
                if(isCorrect) correct++;
                item.style.borderColor = isCorrect ? '#6aaa64' : '#ff4d4d';
                item.querySelector('.peek-btn').style.display = 'none';
                item.draggable = false;
            });
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('masterBtn').style.display = 'block';
            updateStreak(correct === active.items.length);
        }

        function showMaster() {
            const list = document.getElementById('sortable-list');
            const items = [...document.querySelectorAll('.item')].sort((a,b) => a.dataset.rank - b.dataset.rank);
            list.innerHTML = '';
            items.forEach(i => list.appendChild(i));
        }

        function updateStreak(win) {
            let streak = parseInt(localStorage.getItem('ladders_streak')) || 0;
            const last = localStorage.getItem('ladders_last');
            const today = new Date().toISOString().split('T')[0];
            if(last !== today) {
                streak = win ? streak + 1 : 0;
                localStorage.setItem('ladders_streak', streak);
                localStorage.setItem('ladders_last', today);
                document.getElementById('streak-count').innerText = streak;
            }
        }

        function setupDraggables() {
            const list = document.getElementById('sortable-list');
            let dragItem = null;
            list.addEventListener('dragstart', (e) => { dragItem = e.target; e.target.classList.add('dragging'); });
            list.addEventListener('dragend', (e) => { e.target.classList.remove('dragging'); });
            list.addEventListener('dragover', (e) => {
                e.preventDefault();
                const afterElement = [...list.querySelectorAll('.item:not(.dragging)')].reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = e.clientY - box.top - box.height / 2;
                    return (offset < 0 && offset > closest.offset) ? { offset: offset, element: child } : closest;
                }, { offset: Number.NEGATIVE_INFINITY }).element;
                if (afterElement == null) list.appendChild(dragItem);
                else list.insertBefore(dragItem, afterElement);
            });
        }
        init();
    </script>
</body>
</html>
